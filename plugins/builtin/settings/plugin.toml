name = "settings"
version = "0.2.0"
entry = "main.ts"
description = "Every setting in the workspace on one screen — yours, neosh's and every plugin's — saved to config.toml as you change it."

# What other plugins build on. A page is a curated list of options under a title; the panel's
# buffer kind is where a third party binds a key of its own inside it.
[provides]
points = ["settings.page"]
kinds = ["neosh.settings", "neosh.settings.text"]
