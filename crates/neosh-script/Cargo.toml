[package]
name = "neosh-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The deno_core host for neosh plugins, and the whole of its op surface."
keywords = ["neosh", "plugin", "deno", "typescript"]
categories = ["development-tools"]

[dependencies]
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
include_dir = { workspace = true }
neosh-plugins = { workspace = true }
neosh-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
deno_core = { workspace = true }
deno_ast = { workspace = true }
deno_error = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
url = "2"
