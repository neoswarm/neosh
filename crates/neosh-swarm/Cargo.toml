[package]
name = "neosh-swarm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ASCP: the protocol neosh workspaces use to describe agents to one another across machines."
keywords = ["neosh", "ascp", "protocol", "ed25519"]
categories = ["network-programming"]

[dependencies]
neosh-proto = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
# A pty carries whatever the program wrote, and a JSON string cannot hold a lone 0x9b.
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
