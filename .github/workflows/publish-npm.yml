name: publish-npm

# Every builtin is an ordinary plugin, so it is an ordinary npm package too: @neosh/<name>,
# published from the same directory the binary embeds. Runs on release or by hand, skips whatever
# npm already has — safe to run twice.
#
# Tokenless. The trust is a *trusted publisher* configured on npmjs.com against this repository and
# this workflow file, so there is no NPM_TOKEN to leak or rotate. That configuration can only be
# added to a package that already exists, which is why the first version of each package is
# published by hand — see docs/releasing.md.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC, for both trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # setup-node@v4 with Node 22 ships npm 10, and trusted publishing needs 11.5.1 or newer.
      # Without this the OIDC exchange never happens: npm falls back to looking for a token,
      # does not find one, and the whole matrix fails on auth with nothing to say why.
      - run: npm install -g npm@latest

      - name: Publish what npm does not have yet
        run: |
          # Not `set -e`: one package failing must not take the rest with it. The loop is
          # alphabetical, so when `@neosh/update` was added and could not be published — a name npm
          # has never seen has no trusted publisher, and OIDC cannot do a first publish — it also
          # stopped `@neosh/usage`, which had nothing wrong with it and sat a version behind.
          # Failures are collected and reported at the end instead.
          set -uo pipefail
          failed=""
          # `npm/neosh` is not in this list on purpose: the launcher's optional dependencies are
          # the four binaries, so it goes up in release.yml after they do. Publishing it here would
          # put a launcher on npm before there was anything for it to launch.
          for dir in plugins/api plugins/builtin/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version — npm already has it"
              continue
            fi
            echo "publish $name@$version"
            if ! (cd "$dir" && npm publish --access public --provenance); then
              # A name npm has never seen is the expected case here, and it is a person's job:
              # publish it once by hand, then add its trusted publisher. Everything else carries on.
              echo "::warning::$name@$version was not published"
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::not published:$failed"
            echo "A package npm has never seen cannot be published by OIDC. Publish it once by"
            echo "hand, then: npm trust github <name> --file publish-npm.yml --repo neoswarm/neosh"
            exit 1
          fi
