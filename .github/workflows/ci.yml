name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: everything check.sh runs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2

      # The single source of truth: the same script contributors run locally,
      # so "works locally" and "passes CI" are the same sentence.
      #
      # One test at a time, because the integration suites each start a whole
      # workspace — a real daemon, a real socket, plugins and all — and a
      # 4-vCPU runner starting several at once is how a different test timed
      # out on every run: three runs, three different single failures, every
      # one a wait on something a starved workspace had not drawn yet.
      # Most of this job is the linker, not the compiler and not the tests: ~9 minutes of a ~12
      # minute run, with the tests themselves about 3. There are 28 integration test targets and
      # each one links the whole `neosh` crate, so link time is multiplied by 28 — and the default
      # `bfd` linker is the slowest part of that. `lld` is a drop-in for exactly this shape of
      # build.
      - run: sudo apt-get install -y lld
      - run: ./scripts/check.sh
        env:
          RUST_TEST_THREADS: "1"
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          # Incremental state is written and never read: every run starts from a restored cache and
          # ends with the container. Pure write amplification here.
          CARGO_INCREMENTAL: "0"
