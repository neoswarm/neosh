name: release

# Prebuilt binaries, which are how almost everybody actually installs neosh: `cargo install neosh`
# builds deno_core from source and takes about a quarter of an hour, and a Homebrew formula or an
# npm platform package has to have something to point at.
#
# Three things come out of one build: a tarball on the GitHub release, an `@neosh/cli-<os>-<cpu>`
# package on npm, and the checksum a Homebrew formula is written from.
#
# macOS and Linux only, deliberately: the workspace talks to its terminals over a Unix socket
# (`daemon.rs`), so there is nothing to ship for Windows yet.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and upload to
        required: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write # attach assets to the release
      id-token: write # npm trusted publishing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Cross-compiled from Apple silicon rather than built on `macos-13`: that image is
          # retired, so the job simply queued — nine hours, then cancelled, with the other three
          # long finished. Xcode ships both slices, so an arm runner targets x86_64 natively.
          - target: x86_64-apple-darwin
            os: macos-14
          # 22.04 rather than latest: the binary is linked against that runner's glibc, and
          # building on the newest image is how you ship something that will not start on a
          # distribution two years old.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, and setup-node with Node 22 ships npm 10. Without
      # this the OIDC exchange never happens and npm falls back to a token that is not there.
      - run: npm install -g npm@latest

      - run: cargo build --release --locked --target ${{ matrix.target }} -p neosh

      - name: Tar it up, with a checksum
        id: package
        run: |
          set -euo pipefail
          name="neosh-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/neosh" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # shasum is on both runners; sha256sum is not on macOS.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "asset=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

      # Gated, because a trusted publisher cannot be attached to a package that does not exist, so
      # the very first release necessarily runs before there is one. Unset, this skips loudly
      # instead of failing the job red for a reason that is expected — and the assets are already
      # attached by the step above either way. Set it with:
      #   gh variable set NPM_TRUSTED_PUBLISHING --body true
      - name: Publish the npm platform package
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="neosh") | .version')
          bash ./scripts/npm-platform-package.sh "${{ matrix.target }}" "$version" dist/npm \
            "target/${{ matrix.target }}/release/neosh"
          name=$(node -p "require('./dist/npm/package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip $name@$version — npm already has it"
          else
            (cd dist/npm && npm publish --access public --provenance)
          fi

  # The launcher goes up only once every binary it points at is on npm. Its `optionalDependencies`
  # name all four by exact version, and npm resolves them at install time rather than at publish
  # time — so publishing this first is a window in which `npm i -g neosh` installs a launcher with
  # nothing to launch, and says so at the first run rather than at the install that caused it.
  launcher:
    name: npm launcher
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - name: Say so when npm publishing is skipped
        if: vars.NPM_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "::warning::NPM_TRUSTED_PUBLISHING is not set — nothing was published to npm."
          echo "Configure trusted publishers for 'neosh' and the four '@neosh/cli-*' packages,"
          echo "then: gh variable set NPM_TRUSTED_PUBLISHING --body true"

      - name: Publish neosh
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/neosh/package.json').version")
          if npm view "neosh@$version" version >/dev/null 2>&1; then
            echo "skip neosh@$version — npm already has it"
            exit 0
          fi
          (cd npm/neosh && npm publish --access public --provenance)
