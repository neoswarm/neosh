name: publish-plugins

# Every builtin is an ordinary plugin, so it is an ordinary npm package too:
# @neosh/<name>, published from the same directory the binary embeds. Runs on
# release or by hand, skips whatever npm already has — safe to run twice.
# Needs an NPM_TOKEN secret with publish rights on the @neosh org.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish what npm does not have yet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in plugins/api plugins/builtin/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version — npm already has it"
              continue
            fi
            echo "publish $name@$version"
            (cd "$dir" && npm publish --access public --provenance)
          done
